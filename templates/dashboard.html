{%extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div>
    <h1>Dashboard</h1>
    <div>
        <div>
            <canvas id="line-chart" width="800" height="450"></canvas>
        </div>
        <div>
            <canvas id="bar-chart" width="800" height="450"></canvas>
        </div>
    </div>




</div>
<script>
    //Line chart
new Chart(document.getElementById("line-chart"), {
  type: 'line',
  data: {
    labels: {{dates | safe}},
    datasets: [{ 
        data: {{d_sales | safe}},
        label: "Sales",
        borderColor: "#3e95cd",
        fill: false
      }, { 
        data: {{d_profit | safe}},
        label: "Profit",
        borderColor: "#8e5ea2",
        fill: false
      }
    ]
  },
  options: {
    title: {
      display: true,
      text: 'Sales and profit per day(Ksh)'
    }
  }
});
 


 // Bar chart
new Chart(document.getElementById("bar-chart"), {
    type: 'bar',
    data: {
      labels:{{product_names | safe}},
      datasets: [
        {
          label: "Sales",
          backgroundColor: ["#3e95cd", "#8e5ea2","#3cba9f","#e8c3b9","#c45850"],
          data: {{p_sales | safe}}
        },
        {
          label: "Profit",
          backgroundColor: ["#3e95cd", "#8e5ea2","#3cba9f","#e8c3b9","#c45850"],
          data: {{p_profit | safe}}
        }
      ]
    },
    options: {
      legend: { display: false },
      title: {
        display: true,
        text: 'Sales and profits per product'
      }
    }
})
</script>



{% endblock %}
